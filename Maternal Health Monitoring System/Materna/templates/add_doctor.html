<!DOCTYPE html>
<html>

<head>

    <title>Add Doctor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="dashboard-container">

    <div class="topbar">

        <h1>➕ Add Doctor</h1>

        <a href="/admin/doctors">

            <button class="manual-btn">

                ← Back

            </button>

        </a>

    </div>

    <div class="patient-section">

        <h2 style="margin-bottom:25px;">

            Doctor Information

        </h2>

        <form
        action="/save_doctor"
        method="POST">

            <input
            type="text"
            name="full_name"
            placeholder="Full Name"
            required>

            <input
            type="text"
            name="username"
            placeholder="Username"
            required>

            <input
            type="password"
            name="password"
            placeholder="Password"
            required>

            <input
            type="text"
            name="phone"
            placeholder="Phone Number"
            required>

            <input
            type="text"
            name="hospital"
            placeholder="Hospital"
            required>

            <input
            type="text"
            name="specialization"
            placeholder="Specialization"
            required>

            <input
            type="text"
            name="qualification"
            placeholder="Qualification"
            required>

            <input
            type="text"
            name="bmdc"
            placeholder="BMDC Number"
            required>

            <input
            type="text"
            name="experience"
            placeholder="Experience"
            required>

            <button type="submit">

                💾 Save Doctor

            </button>

        </form>

    </div>

</div>

</body>

</html>
